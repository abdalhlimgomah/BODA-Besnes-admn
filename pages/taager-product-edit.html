<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تعديل منتج Taager</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/app-shell.css" />
    <link rel="stylesheet" href="../css/taager-products.css" />
    <script>try{const s=JSON.parse(localStorage.getItem("dashboardSettings")||"{}");if(s.theme==="dark")document.body.classList.add("dark-mode")}catch(e){}</script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="./auth-guard.js"></script>
  </head>
  <body class="app-shell">
    <aside class="app-sidebar">
      <div class="brand-badge">
        <i class="fa-solid fa-bag-shopping"></i>
        <div>
          <strong>Buda Admin</strong>
          <small>إدارة المتجر</small>
        </div>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="shacksf.html"><i class="fa-solid fa-chart-line"></i><span>لوحة التحكم</span></a>
        <a class="side-link" href="admin-support.html"><i class="fa-solid fa-headset"></i><span>رسائل الدعم</span></a>
        <a class="side-link" href="admin.html"><i class="fa-solid fa-square-plus"></i><span>إضافة المنتجات</span></a>
        <a class="side-link" href="admin-orders.html"><i class="fa-solid fa-receipt"></i><span>الطلبات</span></a>
        <a class="side-link" href="admin-partners.html"><i class="fa-solid fa-handshake"></i><span>طلبات الشراكة</span></a>
        <a class="side-link" href="view-products.html"><i class="fa-solid fa-box-open"></i><span>مراجعة المنتجات</span></a>
        <a class="side-link" href="taager-products.html"><i class="fa-solid fa-database"></i><span>منتجات Taager</span></a>
        <a class="side-link" href="admin-sellers.html"><i class="fa-solid fa-store"></i><span>إدارة البائعين</span></a>
      </nav>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-title">
          <h1>تعديل المنتج</h1>
          <p id="editProductName">تحميل...</p>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-secondary" href="taager-products.html" style="text-decoration:none">
            <i class="fa-solid fa-arrow-right"></i> عودة
          </a>
        </div>
      </header>

      <section class="content-wrap">
        <div class="edit-form-card card" id="editForm" style="display:none">
          <div class="editor-grid">
            <div class="field-block span-2">
              <label for="name">اسم المنتج</label>
              <input type="text" id="name" />
            </div>
            <div class="field-block">
              <label for="price">السعر</label>
              <input type="number" id="price" step="0.01" />
            </div>
            <div class="field-block">
              <label for="stock">المخزون</label>
              <input type="number" id="stock" />
            </div>
            <div class="field-block">
              <label for="category">القسم</label>
              <input type="text" id="category" />
            </div>
            <div class="field-block">
              <label for="is_active">الحالة</label>
              <select id="is_active">
                <option value="true">نشط</option>
                <option value="false">غير نشط</option>
              </select>
            </div>
            <div class="field-block span-2">
              <label for="description">الوصف</label>
              <textarea id="description" rows="3"></textarea>
            </div>
            <div class="field-block span-2">
              <label for="image">رابط الصورة</label>
              <input type="url" id="image" dir="ltr" />
            </div>
          </div>
          <div class="form-actions-row">
            <button class="btn btn-primary submit-btn" onclick="saveProduct()">
              <i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات
            </button>
            <a class="btn btn-secondary" href="taager-products.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700">
              <i class="fa-solid fa-times"></i> إلغاء
            </a>
          </div>
        </div>
        <div id="loadingState" class="empty-text" style="padding:40px">جاري تحميل بيانات المنتج...</div>
      </section>
    </main>

    <nav class="mobile-bottom-nav">
      <a class="mobile-link" href="shacksf.html"><i class="fa-solid fa-chart-line"></i><span>الرئيسية</span></a>
      <a class="mobile-link" href="admin.html"><i class="fa-solid fa-square-plus"></i><span>إضافة</span></a>
      <a class="mobile-link" href="admin-orders.html"><i class="fa-solid fa-receipt"></i><span>طلبات</span></a>
      <a class="mobile-link" href="admin-partners.html"><i class="fa-solid fa-handshake"></i><span>شراكة</span></a>
      <a class="mobile-link" href="view-products.html"><i class="fa-solid fa-box-open"></i><span>مراجعة</span></a>
    </nav>

    <script src="./taager-product-edit.page.js"></script>
  </body>
</html>
