<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | Buda Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <script>try{const s=JSON.parse(localStorage.getItem("dashboardSettings")||"{}");if(s.theme==="dark")document.body.classList.add("dark-mode")}catch(e){}</script>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="brand-icon">
          <i class="fa-solid fa-store"></i>
        </div>
        <h1>Buda Admin</h1>
        <p>لوحة التحكم والإدارة</p>
      </div>

      <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <p class="login-subtitle">أدخل بيانات المدخل للوصول للوحة التحكم</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">اسم المستخدم</label>
            <div class="field-input">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="username" name="username" autocomplete="username" placeholder="أدخل اسم المستخدم" required />
            </div>
          </div>

          <div class="field">
            <label for="password">كلمة المرور</label>
            <div class="field-input">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required />
              <button type="button" id="eye" class="eye-btn" aria-label="إظهار كلمة المرور">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <p id="loginError" class="login-error"></p>

          <div class="form-actions">
            <button type="submit" class="login-btn">
              <i class="fa-solid fa-arrow-left-to-bracket"></i>
              دخول
            </button>
          </div>
        </form>
      </div>

      <div class="login-footer">
        &copy; 2026 <strong>Buda</strong> — جميع الحقوق محفوظة
      </div>
    </div>

    <script src="./auth-guard.js"></script>
    <script src="main.js"></script>
  </body>
</html>
