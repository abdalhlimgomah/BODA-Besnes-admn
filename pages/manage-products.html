<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>إدارة المنتجات - Buda</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
<style>
body{margin:0;font-family:'Cairo',sans-serif;background:#f8fafc}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:#0f172a;color:#fff;padding:20px 0;position:fixed;top:0;right:0;bottom:0;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar .brand{padding:0 20px 20px;border-bottom:1px solid #1e293b;font-size:1.2rem;font-weight:800;color:#facc15;display:flex;align-items:center;gap:10px}
.sidebar nav{padding:10px 0;flex:1}
.sidebar a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:#94a3b8;text-decoration:none;font-size:.9rem;font-weight:500;transition:.15s;border-right:3px solid transparent}
.sidebar a:hover,.sidebar a.active{background:#1e293b;color:#fff;border-right-color:#facc15}
.sidebar a .material-icons-outlined{font-size:20px}
.main-content{margin-right:260px;flex:1;padding:24px}
.page-header h1{font-size:1.5rem;font-weight:800;color:#0f172a;margin:0 0 4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e2e8f0}
.tab{padding:10px 20px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:600;font-size:.85rem;color:#64748b}
.tab.active{color:#facc15;border-bottom-color:#facc15}
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-row input{flex:1;min-width:200px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.9rem;font-family:inherit}
.search-row input:focus{border-color:#facc15;outline:none;box-shadow:0 0 0 3px rgba(250,204,21,.15)}
table{width:100%;border-collapse:collapse;font-size:.82rem;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
th{background:#f8fafc;padding:10px 8px;border-bottom:2px solid #e2e8f0;color:#475569;font-weight:700;text-align:right}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
td img{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#f1f5f9}
.price-input{width:80px;padding:4px 6px;border:1px solid #e2e8f0;border-radius:6px;font-size:.8rem;text-align:center;font-family:inherit}
.price-input:focus{border-color:#facc15;outline:none}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:0;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary{background:#facc15;color:#0f172a}
.btn-outline{background:transparent;border:1px solid #e2e8f0;color:#475569}
.btn-sm{padding:3px 8px;font-size:.75rem}
.btn-danger{background:#ef4444;color:#fff}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;z-index:9999;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.7rem;font-weight:700}
.badge-taager{background:#fef3c7;color:#d97706}
.badge-partner{background:#dbeafe;color:#2563eb}
.badge-local{background:#dcfce7;color:#16a34a}
</style>
</head><body>
<div class="app-layout">
<aside class="sidebar">
<div class="brand"><span class="material-icons-outlined">dashboard</span> Buda Admin</div>
<nav>
<a href="admin-sections.html"><span class="material-icons-outlined">view_carousel</span> أقسام الهوم</a>
<a href="manage-products.html" class="active"><span class="material-icons-outlined">inventory</span> إدارة المنتجات</a>
<a href="review-partnership.html"><span class="material-icons-outlined">handshake</span> مراجعة الشراكه</a>
<a href="admin.html" style="margin-top:auto;border-top:1px solid #1e293b;padding-top:16px"><span class="material-icons-outlined">arrow_back</span> لوحة التحكم</a>
</nav>
</aside>
<main class="main-content">
<div class="page-header"><h1>إدارة المنتجات</h1><p style="color:#64748b;font-size:.85rem;margin:0">بحث وتعديل الأسعار والخصومات</p></div>
<div class="tabs" id="mainTabs">
<span class="tab active" onclick="switchTab('store',this)">المتجر</span>
<span class="tab" onclick="switchTab('taager',this)">تاجر</span>
<span class="tab" onclick="switchTab('partner',this)">شركاء</span>
<span class="tab" onclick="switchTab('all',this)">الكل</span>
</div>
<div class="search-row">
<input id="searchInput" type="text" placeholder="ابحث باسم المنتج أو الكود..." oninput="debouncedSearch()"/>
<button class="btn btn-outline" onclick="loadTab()"><span class="material-icons-outlined" style="font-size:16px">search</span> بحث</button>
<button class="btn btn-outline" onclick="saveAllPrices()"><span class="material-icons-outlined" style="font-size:16px">save</span> حفظ الكل</button>
</div>
<div id="tableWrap"><p style="color:#94a3b8;">جارٍ التحميل...</p></div>
<div class="pagination" id="pagination"></div>
</main></div>
<script src="../assets/vendor/supabase/supabase-js@2.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/store.js"></script>
<script>
var currentTab = 'store', searchQuery = '', page = 0, pageSize = 30;
var storePool = [], taagerPool = [], partnerPool = [];
var modifiedPrices = {}; // id -> { price, original_price }

function getClient() { return window.supabaseClient; }
function esc(v) { return String(v||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

async function init() {
  storePool = Object.values(window.BudaStore?.getAllProducts() || {}).filter(Boolean);
  var c = getClient();
  if (c) {
    try { var tpAll=[], tpOff=0, tpPg=1000;
      while(true) { var {data:tpB}=await c.from('taager_products').select('id,taager_product_id,name,price,image,category,quick_details').eq('is_active',true).range(tpOff,tpOff+tpPg-1); if(!tpB||!tpB.length)break; tpAll=tpAll.concat(tpB); tpOff+=tpPg; if(tpB.length<tpPg)break; }
      if (tpAll.length) taagerPool = tpAll.map(function(p){return {id:p.id, name:p.name||'منتج', price:p.price, image:p.image||'', category:p.category, source:'taager', _raw:p, _original_price: 0};});
    } catch(e) { if(e.code!=='42P01')console.warn(e); }
    try { var {data:pp} = await c.from('partner_products').select('id,name,price,image,category').limit(500);
      if (pp&&pp.length) partnerPool = pp.map(function(p){return {id:p.id, name:p.name||'منتج', price:p.price, image:p.image||'', category:p.category, source:'partner'};});
    } catch(e) { if(e.code!=='42P01')console.warn(e); }
  }
  loadTab();
}
function switchTab(tab, el) {
  currentTab = tab; page = 0; searchQuery = document.getElementById('searchInput').value;
  document.querySelectorAll('#mainTabs .tab').forEach(function(t){t.classList.remove('active');});
  if (el) el.classList.add('active');
  loadTab();
}
function loadTab() {
  searchQuery = document.getElementById('searchInput').value;
  var pool = currentTab === 'taager' ? taagerPool : (currentTab === 'partner' ? partnerPool : (currentTab === 'all' ? [...storePool, ...taagerPool, ...partnerPool] : storePool));
  if (searchQuery.trim()) {
    var q = searchQuery.trim().toLowerCase();
    pool = pool.filter(function(p){return (p.name||'').toLowerCase().includes(q) || String(p.id).includes(q) || String(p.price).includes(q);});
  }
  var start = page * pageSize, pg = pool.slice(start, start + pageSize);
  if (!pg.length && page > 0) { page = 0; return loadTab(); }
  document.getElementById('tableWrap').innerHTML =
    '<table><thead><tr><th></th><th>المنتج</th><th>السعر</th><th>الخصم</th><th>حفظ</th></tr></thead><tbody>' +
    pg.map(function(p,i){
      var mod = modifiedPrices[p.id] || {};
      var price = mod.price !== undefined ? mod.price : p.price;
      var orig = window.BudaStore ? window.BudaStore.resolveProductPrice(p).originalPrice : price;
      var op = (mod.original_price !== undefined ? mod.original_price : (orig > price ? orig : price * 1.25));
      var img = p.image || '../assets/images/unnamed.png';
      var srcBadge = p.source === 'taager' ? 'badge-taager' : (p.source === 'partner' ? 'badge-partner' : 'badge-local');
      var srcLabel = p.source === 'taager' ? 'تاجر' : (p.source === 'partner' ? 'شريك' : 'محلي');
      return '<tr>' +
        '<td><img src="'+img+'" onerror="this.src=\'../assets/images/unnamed.png\'"/></td>' +
        '<td><div style="font-weight:600;font-size:.85rem">'+esc(p.name||p.id)+'</div><div style="font-size:.7rem;color:#94a3b8">'+esc(p.id)+' <span class="badge '+srcBadge+'">'+srcLabel+'</span></div></td>' +
        '<td><input class="price-input" type="number" step="0.01" value="'+Number(price).toFixed(2)+'" onchange="updatePrice(\''+p.id+'\',this.value,\'price\')"/></td>' +
        '<td><input class="price-input" type="number" step="0.01" value="'+Number(op).toFixed(2)+'" onchange="updatePrice(\''+p.id+'\',this.value,\'original\')"/></td>' +
        '<td>'+(mod.price !== undefined || mod.original_price !== undefined ? '<button class="btn btn-primary btn-sm" onclick="saveSingle(\''+p.id+'\')">حفظ</button>' : '—')+'</td></tr>';
    }).join('') + '</tbody></table>' +
    '<div style="margin-top:8px;font-size:.8rem;color:#64748b">إجمالي: '+pool.length+' منتج</div>';
  var tp = Math.ceil(pool.length / pageSize);
  document.getElementById('pagination').innerHTML =
    (page > 0 ? '<button class="btn btn-outline btn-sm" onclick="page--;loadTab()">السابق</button>' : '') +
    '<span style="font-size:.8rem;color:#64748b">'+(page+1)+'/'+tp+'</span>' +
    (start+pageSize < pool.length ? '<button class="btn btn-outline btn-sm" onclick="page++;loadTab()">التالي</button>' : '');
}
function updatePrice(id, val, type) {
  if (!modifiedPrices[id]) modifiedPrices[id] = {};
  modifiedPrices[id][type === 'price' ? 'price' : 'original_price'] = parseFloat(val) || 0;
  loadTab();
}
async function saveSingle(id) {
  var mod = modifiedPrices[id];
  if (!mod) return;
  try {
    var c = getClient();
    if (!c) return;
    if (mod.original_price > 0) {
      var p = taagerPool.find(function(x){return x.id===id;}) || storePool.find(function(x){return x.id===id;});
      await c.from('product_original_prices').upsert({product_id: id, product_name: p ? p.name : '', product_price: mod.price || 0, fake_original_price: mod.original_price, updated_at: new Date().toISOString()}, {onConflict: 'product_id'});
    }
    delete modifiedPrices[id];
    toast('تم الحفظ');
    loadTab();
  } catch(e) { toast('خطأ: '+e.message); }
}
async function saveAllPrices() {
  var ids = Object.keys(modifiedPrices);
  if (!ids.length) { toast('لا توجد تغييرات للحفظ'); return; }
  try {
    var c = getClient(); if (!c) return;
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i], mod = modifiedPrices[id];
      if (mod.original_price > 0) {
        var p = taagerPool.find(function(x){return x.id===id;}) || storePool.find(function(x){return x.id===id;});
        await c.from('product_original_prices').upsert({product_id: id, product_name: p ? p.name : '', product_price: mod.price || 0, fake_original_price: mod.original_price, updated_at: new Date().toISOString()}, {onConflict: 'product_id'});
      }
    }
    modifiedPrices = {};
    toast('تم حفظ ' + ids.length + ' منتج');
    loadTab();
  } catch(e) { toast('خطأ: '+e.message); }
}
var debouncedSearch = (function(){var t;return function(){clearTimeout(t);t=setTimeout(function(){page=0;loadTab();},400);};})();
function toast(m){var el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(function(){el.remove();},2500);}
setTimeout(init, 500);
</script>
</body></html>
