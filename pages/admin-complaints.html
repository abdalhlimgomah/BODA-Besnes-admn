<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الشكاوي - Buda Admin</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/app-shell.css" />
    <style>
      .comp-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      .comp-table th { background: #f1f5f9; text-align: start; padding: 10px 12px; font-weight: 700; color: #1e293b; border-bottom: 2px solid #e2e8f0; }
      .comp-table td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
      .comp-table tr:hover td { background: #f8fafc; }
      .comp-subject { font-weight: 700; color: #0f172a; cursor: pointer; }
      .comp-subject:hover { color: #4f46e5; }
      .comp-message-preview { color: #64748b; font-size: 0.8rem; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .reply-text { background: #f0f9ff; padding: 8px 10px; border-radius: 6px; border-right: 3px solid #3b82f6; font-size: 0.8rem; color: #1e293b; margin-top: 4px; }
      .badge-pending { background: #fef3c7; color: #92400e; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
      .badge-replied { background: #dbeafe; color: #1e40af; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
      .badge-closed { background: #dcfce7; color: #166534; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: none; align-items: center; justify-content: center; }
      .modal-backdrop.show { display: flex; }
      .modal-card { background: #fff; border-radius: 16px; padding: 28px; max-width: 520px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    </style>
    <script>try{const s=JSON.parse(localStorage.getItem("dashboardSettings")||"{}");if(s.theme==="dark")document.body.classList.add("dark-mode")}catch(e){}</script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="./auth-guard.js"></script>
  </head>
  <body class="app-shell">
    <aside class="app-sidebar">
      <div class="brand-badge">
        <i class="fa-solid fa-bag-shopping"></i>
        <div><strong>Buda Admin</strong><small>إدارة المتجر</small></div>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="shacksf.html"><i class="fa-solid fa-chart-line"></i><span>لوحة التحكم</span></a>
        <a class="side-link" href="admin-support.html"><i class="fa-solid fa-headset"></i><span>رسائل الدعم</span></a>
        <a class="side-link" href="admin.html"><i class="fa-solid fa-square-plus"></i><span>إضافة المنتجات</span></a>
        <a class="side-link" href="admin-orders.html"><i class="fa-solid fa-receipt"></i><span>الطلبات</span></a>
        <a class="side-link" href="admin-partners.html"><i class="fa-solid fa-handshake"></i><span>طلبات الشراكة</span></a>
        <a class="side-link" href="view-products.html"><i class="fa-solid fa-box-open"></i><span>مراجعة المنتجات</span></a>
        <a class="side-link active" href="admin-complaints.html"><i class="fa-solid fa-message"></i><span>الشكاوي</span></a>
        <a class="side-link" href="admin-ai-details.html"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI محتوى</span></a>
        <a class="side-link" href="taager-products.html"><i class="fa-solid fa-database"></i><span>منتجات Taager</span></a>
        <a class="side-link" href="admin-sellers.html"><i class="fa-solid fa-store"></i><span>إدارة البائعين</span></a>
        <a class="side-link" href="admin-coupons.html"><i class="fa-solid fa-tags"></i><span>إدارة الكوبونات</span></a>
        <a class="side-link" href="admin-fake-prices.html"><i class="fa-solid fa-percent"></i><span>الأسعار الوهمية</span></a>
        <a class="side-link" href="admin-taager-token.html"><i class="fa-solid fa-key"></i><span>توكن تاجر</span></a>
      </nav>
    </aside>
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-title">
          <h1><i class="fa-solid fa-message"></i> الشكاوي</h1>
          <p>إدارة واستعراض شكاوي ورسائل المستخدمين</p>
        </div>
      </header>
      <section class="content-wrap" style="padding:0 24px 24px;">
        <div id="summary-cards" style="display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;"></div>
        <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
          <input id="searchInput" type="text" placeholder="بحث بالاسم أو البريد..." style="flex:1;min-width:200px;padding:10px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:0.85rem;" />
          <select id="filterStatus" style="padding:10px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:0.85rem;">
            <option value="">كل الحالات</option>
            <option value="pending">قيد الانتظار</option>
            <option value="replied">تم الرد</option>
            <option value="closed">مغلقة</option>
          </select>
        </div>
        <div id="complaints-list" style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.05);"></div>
      </section>
    </main>
    <nav class="mobile-bottom-nav">
      <a class="mobile-link" href="shacksf.html"><i class="fa-solid fa-chart-line"></i><span>الرئيسية</span></a>
      <a class="mobile-link" href="admin.html"><i class="fa-solid fa-square-plus"></i><span>إضافة</span></a>
      <a class="mobile-link" href="admin-orders.html"><i class="fa-solid fa-receipt"></i><span>طلبات</span></a>
      <a class="mobile-link active" href="admin-complaints.html"><i class="fa-solid fa-message"></i><span>شكاوي</span></a>
      <a class="mobile-link" href="view-products.html"><i class="fa-solid fa-box-open"></i><span>مراجعة</span></a>
    </nav>

    <!-- Reply Modal -->
    <div id="reply-modal" class="modal-backdrop">
      <div class="modal-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="margin:0;">الرد على الشكوى</h3>
          <button onclick="closeReplyModal()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#6b7280;">&times;</button>
        </div>
        <div id="reply-info" style="margin-bottom:14px;padding:10px;background:#f8fafc;border-radius:8px;"></div>
        <textarea id="reply-textarea" rows="5" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:0.85rem;font-family:inherit;resize:vertical;" placeholder="اكتب ردك هنا..."></textarea>
        <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end;">
          <button class="btn btn-secondary" onclick="closeReplyModal()">إلغاء</button>
          <button class="btn btn-primary" id="send-reply-btn" onclick="sendReply()">إرسال الرد</button>
        </div>
      </div>
    </div>

    <script src="./admin-complaints.page.js"></script>
  </body>
</html>
